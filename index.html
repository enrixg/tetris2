<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tetris</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      margin: 0;
      background: #181818;
      color: #fff;
      font-family: sans-serif;
      user-select: none;
      overflow: hidden;
    }
    #game-container {
      display: flex;
    }
    canvas {
      display: block;
      background: #000;
    }
    #game {
      width: 200px;
      height: 400px;
      border: 4px solid #444;
      box-shadow: 0 0 10px rgba(0,0,0,0.7);
      outline: none;
    }
    #next-score {
      margin-left: 20px;
    }
    #next {
      width: 80px;
      height: 80px;
      border: 4px solid #444;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
      background: #000;
      margin-bottom: 10px;
    }
    #score, #level {
      font-size: 18px;
      margin: 5px 0;
    }
    #controls {
      margin-top: 20px;
      font-size: 14px;
    }
    #controls ul {
      padding-left: 20px;
    }
    #controls li {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="200" height="400" tabindex="0"></canvas>
    <div id="next-score">
      <canvas id="next" width="80" height="80"></canvas>
      <div>Score: <span id="score">0</span></div>
      <div>Level: <span id="level">1</span></div>
      <div id="controls">
        <strong>Controls</strong>
        <ul>
          <li>← or A: Move Left</li>
          <li>→ or D: Move Right</li>
          <li>↓ or S: Soft Drop</li>
          <li>↑ or W: Rotate</li>
          <li>Space: Hard Drop</li>
        </ul>
      </div>
    </div>
  </div>
  <script>
    // Constants
    const COLS = 10, ROWS = 20, SQ = 20;
    const VACANT = 0;
    const COLORS = [
      null,
      ['#00ffff','#66ffff'],
      ['#0000ff','#6666ff'],
      ['#ffa500','#ffbf66'],
      ['#ffff00','#ffff99'],
      ['#00ff00','#66ff66'],
      ['#800080','#cc66cc'],
      ['#ff0000','#ff6666']
    ];
    const SHAPES = [
      [[1,1,1,1]], // I
      [[2,0,0],[2,2,2]], // J
      [[0,0,3],[3,3,3]], // L
      [[4,4],[4,4]], // O
      [[0,5,5],[5,5,0]], // S
      [[0,6,0],[6,6,6]], // T
      [[7,7,0],[0,7,7]]  // Z
    ];

    // Canvas and contexts
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');

    // Rotate matrix function
    function rotate(matrix) {
      const rows = matrix.length, cols = matrix[0].length;
      const result = [];
      for (let c = 0; c < cols; c++) {
        result[c] = [];
        for (let r = 0; r < rows; r++) {
          result[c][r] = matrix[rows - 1 - r][c];
        }
      }
      return result;
    }

    // Piece class
    class Piece {
      constructor(shape, color) {
        this.shape = shape;
        this.color = color;
        this.x = Math.floor((COLS - shape[0].length) / 2);
        this.y = 0;
        this.rotations = [shape];
        for (let i = 1; i < 4; i++) this.rotations[i] = rotate(this.rotations[i-1]);
        this.rotationIndex = 0;
      }
      draw(context) {
        const matrix = this.rotations[this.rotationIndex];
        for (let r = 0; r < matrix.length; r++) {
          for (let c = 0; c < matrix[r].length; c++) {
            if (matrix[r][c]) drawSquare(context, this.x + c, this.y + r, this.color);
          }
        }
      }
      drawNext(context) {
        context.clearRect(0,0,nextCanvas.width,nextCanvas.height);
        const matrix = this.rotations[this.rotationIndex];
        const offX = Math.floor((4 - matrix[0].length) / 2);
        const offY = Math.floor((4 - matrix.length) / 2);
        for (let r = 0; r < matrix.length; r++) {
          for (let c = 0; c < matrix[r].length; c++) {
            if (matrix[r][c]) drawSquare(context, c + offX, r + offY, this.color, SQ);
          }
        }
      }
      move(dir) {
        this.x += dir;
        if (collision(this)) this.x -= dir;
      }
      rotatePiece() {
        const prev = this.rotationIndex;
        this.rotationIndex = (this.rotationIndex + 1) % 4;
        if (collision(this)) this.rotationIndex = prev;
      }
      drop() {
        this.y++;
        if (collision(this)) {
          this.y--;
          lockPiece();
        }
        dropStart = Date.now();
      }
    }

    // Game state variables
    let board, currentPiece, nextPiece;
    let score = 0, level = 1, speed = 1000, dropStart;

    // Create empty board
    function createBoard() {
      board = Array.from({ length: ROWS }, () => Array(COLS).fill(VACANT));
    }

    // Draw the board
    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          drawSquare(ctx, c, r, board[r][c]);
        }
      }
    }

    // Draw a square
    function drawSquare(context, x, y, colorIndex, size = SQ) {
      const px = x * size, py = y * size;
      if (!colorIndex) {
        context.fillStyle = '#000';
        context.fillRect(px, py, size, size);
        return;
      }
      const [c1, c2] = COLORS[colorIndex];
      const grad = context.createLinearGradient(px, py, px + size, py + size);
      grad.addColorStop(0, c1);
      grad.addColorStop(1, c2);
      context.fillStyle = grad;
      context.fillRect(px, py, size, size);
      context.strokeStyle = '#333';
      context.lineWidth = 2;
      context.strokeRect(px, py, size, size);
    }

    // Collision detection
    function collision(piece) {
      const matrix = piece.rotations[piece.rotationIndex];
      for (let r = 0; r < matrix.length; r++) {
        for (let c = 0; c < matrix[r].length; c++) {
          if (matrix[r][c]) {
            const newX = piece.x + c;
            const newY = piece.y + r;
            if (newX < 0 || newX >= COLS || newY >= ROWS || (newY >= 0 && board[newY][newX])) {
              return true;
            }
          }
        }
      }
      return false;
    }

    // Generate a random piece
    function randomPiece() {
      const idx = Math.floor(Math.random() * SHAPES.length);
      return new Piece(SHAPES[idx], idx + 1);
    }

    // Lock piece into board and clear lines
    function lockPiece() {
      const matrix = currentPiece.rotations[currentPiece.rotationIndex];
      for (let r = 0; r < matrix.length; r++) {
        for (let c = 0; c < matrix[r].length; c++) {
          if (matrix[r][c]) {
            board[currentPiece.y + r][currentPiece.x + c] = currentPiece.color;
          }
        }
      }
      let lines = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r].every(cell => cell !== VACANT)) {
          board.splice(r, 1);
          board.unshift(Array(COLS).fill(VACANT));
          lines++;
          r++;
        }
      }
      if (lines) {
        score += lines * 100;
        level = Math.floor(score / 1000) + 1;
        speed = 1000 * Math.pow(0.9, level - 1);
        updateScore();
      }
      // Next piece
      currentPiece = nextPiece;
      nextPiece = randomPiece();
      nextPiece.drawNext(nextCtx);
      if (collision(currentPiece)) {
        alert('Game Over');
        initGame();
      }
    }

    // Update score and level display
    function updateScore() {
      document.getElementById('score').innerText = score;
      document.getElementById('level').innerText = level;
    }

    // Main draw function
    function draw() {
      drawBoard();
      currentPiece.draw(ctx);
    }

    // Drop loop for automatic dropping
    function dropLoop() {
      const now = Date.now();
      if (now - dropStart > speed) currentPiece.drop();
      draw();
      requestAnimationFrame(dropLoop);
    }

    // Key controls using keyCode for compatibility
    document.addEventListener('keydown', e => {
      switch (e.keyCode) {
        case 37: case 65: // Left
          e.preventDefault(); currentPiece.move(-1); break;
        case 39: case 68: // Right
          e.preventDefault(); currentPiece.move(1); break;
        case 40: case 83: // Soft drop
          e.preventDefault(); currentPiece.drop(); break;
        case 38: case 87: // Rotate
          e.preventDefault(); currentPiece.rotatePiece(); break;
        case 32: // Hard drop
          e.preventDefault(); while(!collision(currentPiece)) currentPiece.y++; currentPiece.y--; lockPiece(); break;
      }
      draw();
    });

    // Initialize game
    function initGame() {
      createBoard();
      score = 0; level = 1; speed = 1000;
      currentPiece = randomPiece();
      nextPiece = randomPiece();
      dropStart = Date.now();
      updateScore();
      nextPiece.drawNext(nextCtx);
      draw();
      dropLoop();
      // Focus to capture keys
      canvas.focus();
    }

    initGame();
  </script>
</body>
</html>
